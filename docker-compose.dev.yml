name: template-mvc-laravel-standard
# Servicios auxiliares de desarrollo: buzón de correo de pruebas (Mailpit).
# Uso: docker compose -f docker-compose.yml -f docker-compose.databases.yml -f docker-compose.dev.yml up -d
services:
    mailpit:
        image: "axllent/mailpit:latest"
        ports:
            - "${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - template-mvc-laravel-standard
    app:
        depends_on:
            - pgsql
            - mailpit

networks:
    template-mvc-laravel-standard:
        name: template-mvc-laravel-standard
        driver: bridge
