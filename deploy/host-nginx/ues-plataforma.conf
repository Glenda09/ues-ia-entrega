# nginx del host (Debian): proxy inverso público hacia el balanceador Docker.
# Copiar a /etc/nginx/sites-available/ues-plataforma.conf, reemplazar el dominio y enlazar
# en sites-enabled. certbot --nginx agrega luego el bloque 443 (TLS) y la redirección.
# Guía: app/docs/deploy-vm-docker.md

upstream ues_plataforma_lb {
    # Puerto publicado por el servicio "lb" (LB_BIND:LB_PORT en .env.production).
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name plataforma.example.edu;

    # Subidas de admisión (<= 10 MB por petición) con margen.
    client_max_body_size 12m;

    # Desafíos HTTP-01 de certbot (también funciona con el plugin --nginx).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://ues_plataforma_lb;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
