[www]
user = laravel
group = laravel
listen = 127.0.0.1:9000
pm = dynamic
; Cada proceso puede abrir conexiones a PostgreSQL: réplicas x max_children debe caber en max_connections.
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
catch_workers_output = yes
; Conserva las variables del contenedor (env_file de Compose): en producción no hay .env.
clear_env = no
request_terminate_timeout = 600

; Logs a stderr/stdout para Cloud Run
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
