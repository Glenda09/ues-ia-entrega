# Balanceador interno (servicio "lb" de docker-compose.prod.yml).
# Reparte las peticiones entre todas las réplicas del servicio "app". El DNS de Docker
# devuelve una IP por réplica; con "resolve" nginx (>= 1.27.3) vuelve a consultarlo y
# agrega o quita réplicas al escalar, sin recargar la configuración.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    # DNS interno de Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Igual que el nginx interno: subidas de admisión (<= 10 MB por petición) con margen.
    client_max_body_size 12m;

    upstream app_backend {
        zone app_backend 64k;
        least_conn;
        server app:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Respeta el esquema/puerto que declara el nginx del host (TLS); si no viene, usa el propio.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }
    # X-Forwarded-Port solo se reenvía si llega del nginx del host (un valor vacío no se envía);
    # sin él Laravel toma el puerto público de X-Forwarded-Host (p. ej. localhost:8080).
    # Host público con puerto: si el host ya lo reenvía se conserva.
    map $http_x_forwarded_host $fwd_host {
        default $http_x_forwarded_host;
        ''      $http_host;
    }

    server {
        listen 80;
        server_name _;

        location = /lb-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Port  $http_x_forwarded_port;
            proxy_set_header X-Forwarded-Host  $fwd_host;

            proxy_connect_timeout 5s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # Reintenta en otra réplica solo si la conexión falla (no repite peticiones ya procesadas).
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;

            # Diagnóstico: IP de la réplica que atendió. Elimínelo si no desea exponerlo.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
