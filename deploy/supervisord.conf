[supervisord]
nodaemon=true
user=laravel
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=laravel:laravel

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; RUN_WEB / RUN_SCHEDULER los exporta entrypoint.sh según CONTAINER_ROLE (all|web|worker).
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=10
autostart=%(ENV_RUN_WEB)s
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=%(ENV_RUN_WEB)s
autorestart=true

[program:laravel-scheduler]
directory=/var/www/html
command=/usr/local/bin/php artisan schedule:work
autostart=%(ENV_RUN_SCHEDULER)s
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

[include]
files = /etc/supervisor/conf.d/*.conf
