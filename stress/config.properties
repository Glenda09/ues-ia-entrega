# =============================================================================
# Configuración de la prueba de estrés del formulario de inscripción (admisión)
# =============================================================================
# Edita estos valores antes de ejecutar. Puedes sobrescribir cualquiera desde la
# línea de comandos con -J<CLAVE>=<valor> (por ejemplo -JBASE_URL=https://qa.ues.test)
# o con el parámetro -BaseUrl / BASE_URL=... de los ejecutores.

# URL base de la aplicación, sin barra final. Incluye protocolo y puerto.
BASE_URL=http://localhost:8090

# Convocatoria abierta cuyo formulario se ejercita (GET /api/publico/convocatorias).
CONVOCATORIA=1

# Contraseña de las cuentas aspirante.stress.N@ues.test creadas por preparar-cuentas.php.
PASSWORD=Stress2026!

# Carga objetivo: peticiones por segundo del formulario (GET + 2 PATCH del borrador).
OBJETIVO_RPS=15

# Usuarios virtuales concurrentes. Debe ser <= cuentas preparadas.
# Con 50 hilos cada aspirante envía ~0.3 peticiones/s (18/min).
HILOS=50

# Segundos para arrancar todos los hilos y duración total de la prueba.
RAMPA_SEG=60
DURACION_SEG=300

# Tiempos de espera HTTP (ms).
CONNECT_TIMEOUT_MS=5000
RESPONSE_TIMEOUT_MS=30000

# Criterios de aceptación que valida el ejecutor sobre el tramo estable (tras la rampa).
TOLERANCIA_RPS_PCT=5
MAX_ERROR_PCT=1
MAX_P95_MS=2000

# --- Opciones de JMeter (no editar salvo necesidad) ---------------------------
summariser.interval=30
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.timestamp_format=ms
# Escribe cada muestra al instante (resultados útiles aunque la prueba se interrumpa).
jmeter.save.saveservice.autoflush=true
# El reporte HTML (-e -o) solo incluye las peticiones de preparación y del formulario.
jmeter.reportgenerator.sample_filter=^(Formulario|Preparaci).*
jmeter.reportgenerator.overall_granularity=1000
