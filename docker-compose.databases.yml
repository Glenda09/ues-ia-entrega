name: template-mvc-laravel-standard
services:
    pgsql:
        image: "postgres:17-alpine"
        ports:
            - "${FORWARD_DB_PORT:-5454}:5432"
        environment:
            PGPASSWORD: "${DB_PASSWORD:-postgres}"
            POSTGRES_DB: "${DB_DATABASE}"
            POSTGRES_USER: "${DB_USERNAME}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
        volumes:
            - "mvc-sail-pgsql:/var/lib/postgresql/data"
        networks:
            - template-mvc-laravel-standard
        healthcheck:
            test:
                - CMD
                - pg_isready
                - "-q"
                - "-d"
                - "${DB_DATABASE}"
                - "-U"
                - "${DB_USERNAME}"
            retries: 3
            timeout: 5s

networks:
    template-mvc-laravel-standard:
        name: template-mvc-laravel-standard
        driver: bridge

volumes:
    mvc-sail-pgsql:
        driver: local
