# Despliegue escalable en un servidor (guía: docs/deploy-vm-docker.md).
#
#   nginx del host (TLS) -> lb (nginx) -> app x N réplicas (CONTAINER_ROLE=web)
#                                        worker (CONTAINER_ROLE=worker: colas + scheduler)
#   pgsql-primary (escrituras) --streaming síncrono--> pgsql-replica (lecturas)
#
# Uso (desde app/):
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --scale app=4
#
# --env-file alimenta la interpolación de este archivo y env_file entrega las mismas
# variables a los contenedores de Laravel. Es independiente del stack de desarrollo.
name: ${COMPOSE_PROJECT_NAME:-ues-plataforma}

x-app: &app
    image: ues-plataforma/app:${APP_IMAGE_TAG:-latest}
    env_file: .env.production
    restart: unless-stopped
    volumes:
        - app-storage:/var/www/html/storage/app
    networks:
        - backend
    depends_on:
        pgsql-primary:
            condition: service_healthy
        pgsql-replica:
            condition: service_healthy

services:
    pgsql-primary:
        image: postgres:17-alpine
        restart: unless-stopped
        command:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
            - -c
            - max_connections=${PG_MAX_CONNECTIONS:-200}
            - -c
            - wal_keep_size=512MB
        environment:
            POSTGRES_DB: ${DB_DATABASE:?Defina DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME:?Defina DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
            REPLICATION_USER: ${REPLICATION_USER:-replicator}
            REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?Defina REPLICATION_PASSWORD}
            REPLICATION_SLOT: ${REPLICATION_SLOT:-replica1}
            # sync = remote_apply (lecturas nunca atrasadas); async = sin espera de la réplica.
            REPLICATION_MODE: ${REPLICATION_MODE:-sync}
        volumes:
            - pg-primary:/var/lib/postgresql/data
            - ./deploy/postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-replicacion.sh:ro
        networks:
            - backend
        healthcheck:
            # Por TCP: el servidor temporal del init solo escucha en el socket local.
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 10s

    pgsql-replica:
        image: postgres:17-alpine
        restart: unless-stopped
        user: postgres
        entrypoint: ["bash", "/usr/local/bin/replica-entrypoint.sh"]
        command:
            - -c
            - hot_standby=on
            - -c
            - hot_standby_feedback=on
            - -c
            - cluster_name=${REPLICATION_SLOT:-replica1}
            - -c
            - max_connections=${PG_MAX_CONNECTIONS:-200}
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
        environment:
            PGDATA: /var/lib/postgresql/data
            PRIMARY_HOST: pgsql-primary
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_DB: ${DB_DATABASE}
            REPLICATION_USER: ${REPLICATION_USER:-replicator}
            REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
            REPLICATION_SLOT: ${REPLICATION_SLOT:-replica1}
        volumes:
            - pg-replica:/var/lib/postgresql/data
            - ./deploy/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
        networks:
            - backend
        depends_on:
            pgsql-primary:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && [ \"$$(psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'select pg_is_in_recovery()')\" = t ]"]
            interval: 5s
            timeout: 5s
            retries: 60
            start_period: 20s

    app:
        <<: *app
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VITE_THEME_LAYOUT: ${VITE_THEME_LAYOUT:-admin-sidebar}
                VITE_THEME_PALETTE: ${VITE_THEME_PALETTE:-light-soft}
                VITE_THEME_COLOR_MODE: ${VITE_THEME_COLOR_MODE:-auto}
                VITE_APP_NAME: ${VITE_APP_NAME:-Plataforma}
                VITE_APP_URL: ${VITE_APP_URL:-}
        environment:
            CONTAINER_ROLE: web
        deploy:
            replicas: ${APP_REPLICAS:-2}
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 30s

    worker:
        <<: *app
        # Usa la imagen construida por el servicio app (no se descarga de un registro).
        pull_policy: never
        environment:
            CONTAINER_ROLE: worker
        deploy:
            replicas: ${WORKER_REPLICAS:-1}
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null && pgrep -f 'artisan schedule:work' >/dev/null"]
            interval: 15s
            timeout: 5s
            retries: 4
            start_period: 30s

    lb:
        image: nginx:1.28-alpine
        restart: unless-stopped
        ports:
            # Solo localhost por defecto: el tráfico público entra por el nginx del host (TLS).
            - "${LB_BIND:-127.0.0.1}:${LB_PORT:-8080}:80"
        volumes:
            - ./deploy/lb/nginx.conf:/etc/nginx/nginx.conf:ro
        networks:
            - backend
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1/lb-health"]
            interval: 10s
            timeout: 5s
            retries: 3

networks:
    backend:
        driver: bridge

volumes:
    pg-primary:
    pg-replica:
    app-storage:
